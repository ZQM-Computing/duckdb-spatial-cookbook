name: Validate examples

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  duckdb:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install DuckDB
        run: pip install -r requirements.txt

      - name: Test bounded result rendering
        run: python -m pytest -q tests/test_runner.py

      - name: Run examples and checks
        run: python scripts/run_examples.py
