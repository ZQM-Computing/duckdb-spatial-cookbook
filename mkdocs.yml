site_name: DuckDB Spatial Patterns
site_description: DuckDB Spatial SQL examples for GeoJSON and GeoParquet, spatial joins, KNN, CRS handling, GeoParquet export, and H3 aggregation without a database server.
site_author: ZQM Computing
repo_url: https://github.com/ZQM-Computing/duckdb-spatial-cookbook
site_url: https://duckdb.zqmlabs.com/
theme:
    name: material
    custom_dir: docs/overrides
    palette:
      - scheme: slate
        primary: blue
        accent: light blue
        toggle:
          icon: material/brightness-7
          name: Switch to light mode
      - scheme: default
        primary: blue
        accent: blue
        toggle:
          icon: material/brightness-4
          name: Switch to dark mode
markdown_extensions:
    - admonition
    - codehilite:
        guess_lang: false
    - toc:
        permalink: true
nav:
    - Home: index.md
